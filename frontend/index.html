<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="墨痕" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="墨痕 · 个人博客" />
    <title>墨痕 · 个人博客</title>
    <!-- 国内直连：避免依赖 Google Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/libre-bodoni@5.2.5/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/public-sans@5.2.5/index.min.css" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mohhen-theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.classList.toggle('dark', theme === 'dark')

          var locale = localStorage.getItem('mohhen-locale')
          if (locale !== 'zh' && locale !== 'en') {
            locale = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'zh'
          }
          document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN'
        } catch (e) {}
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
